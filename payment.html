<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Flyin' Iris</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <style>
    body { margin: 0; background: #0A0A0A; color: #F5F0EB; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 40px; height: 40px; border: 3px solid #2A2A28; border-top-color: #FFBD1D; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Bridge: redirect to Worker-served payment page preserving query params
    (function() {
      var workerBase = 'https://iris-automation.flyin-iris-mp.workers.dev';
      window.location.replace(workerBase + '/payment' + window.location.search);
    })();
  </script>
</head>
<body>
  <div style="text-align:center;">
    <div class="spinner"></div>
    <p style="color: #C8C3B8; font-size: 14px;">Redirecting to payment...</p>
  </div>
</body>
